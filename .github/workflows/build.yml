# Pacchetti per Windows, macOS, Android e telefono, e la release su GitHub.
#
# Il pacchetto macOS si puo' costruire SOLO su macOS: il bundle .app e il DMG
# richiedono strumenti Apple che su Windows non esistono. Qui il lavoro lo fa
# una macchina macOS di GitHub, senza doverne possedere una.
#
# Si avvia da solo a ogni tag "v*" (es. v0.1.0), oppure a mano dalla scheda
# Actions del repository. Con un tag, alla fine i file finiscono tutti nella
# release con quel nome.

name: pacchetti

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
            comando: npm run dist:win
            file: release/*.exe
          - os: macos-latest
            nome: macos
            comando: npm run dist:mac
            file: release/*.dmg
          - os: ubuntu-latest
            nome: android
            comando: npm run android:sync && cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon && cd .. && cp android/app/build/outputs/apk/release/app-release.apk release/THE-WIRE-Android.apk
            file: release/*.apk
          - os: ubuntu-latest
            nome: telefono
            comando: npm run pwa && mkdir -p release/THE-WIRE-telefono && cp -r apps/pwa/sito/. release/THE-WIRE-telefono/ && cd release && zip -r THE-WIRE-telefono.zip THE-WIRE-telefono
            file: release/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: matrix.nome == 'android'
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Prima la compilazione: un test carica `@wire/core` dal `dist`
      # compilato, e su una macchina pulita quel `dist` non esiste ancora.
      - run: npm run build

      # I test sono il cancello: un test rosso non costruisce niente.
      - run: npm test

      - run: mkdir -p release

      # La chiave di firma Android vive nei secrets del repository, non nel
      # codice: qui si ricompone in un file che vive solo su questa macchina.
      - name: Chiave di firma Android
        if: matrix.nome == 'android'
        shell: bash
        run: echo "$ANDROID_FIRMA_JKS_BASE64" | base64 -d > android/app/firma.jks
        env:
          ANDROID_FIRMA_JKS_BASE64: ${{ secrets.ANDROID_FIRMA_JKS_BASE64 }}

      - name: Costruisci il pacchetto
        run: ${{ matrix.comando }}
        shell: bash
        env:
          # Senza certificato Apple la firma si salta: l'app resta usabile, ma
          # al primo avvio serve tasto destro -> Apri. Con un account Developer
          # si aggiungono qui CSC_LINK e CSC_KEY_PASSWORD come segreti.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Firma Android (vedi android/app/build.gradle).
          WIRE_FIRMA_FILE: firma.jks
          WIRE_FIRMA_PASSWORD: ${{ secrets.ANDROID_FIRMA_PASSWORD }}
          WIRE_FIRMA_ALIAS: ${{ secrets.ANDROID_FIRMA_ALIAS }}
          WIRE_FIRMA_KEY_PASSWORD: ${{ secrets.ANDROID_FIRMA_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: the-wire-${{ matrix.nome }}
          path: ${{ matrix.file }}
          if-no-files-found: error

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
          name: THE WIRE ${{ github.ref_name }}
          body: |
            Pacchetti costruiti da GitHub Actions per il tag ${{ github.ref_name }}.

            - **Windows**: `THE-WIRE-Setup-x.y.z.exe` — doppio clic, si installa da solo.
            - **macOS**: `.dmg` per Apple Silicon (arm64) e Intel (x64). Non firmato: la prima volta tasto destro → Apri.
            - **Android**: `THE-WIRE-Android.apk` — si copia sul telefono e si installa.
            - **iPhone e Android senza installare**: la web app è già in linea su https://z0cc0.github.io/the-wire/ (aprire con Safari, poi «Aggiungi a schermata Home»). `THE-WIRE-telefono.zip` è la stessa cartella, per chi vuole metterla su un indirizzo proprio.
