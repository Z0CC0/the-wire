apply plugin: 'com.android.application'

android {
    // Firma del pacchetto. La chiave NON sta nel repository: e' una chiave
    // nostra, serve solo perche' Android non installa un pacchetto non firmato,
    // ma chi la avesse potrebbe spacciare un'app sua per THE WIRE. Cambiandola,
    // il telefono tratta l'app come un'altra e chiede di disinstallare la vecchia.
    //
    // Si legge, in ordine: dalle variabili d'ambiente WIRE_FIRMA_* (su GitHub
    // Actions arrivano dai secrets), oppure da `android/firma.properties`
    // (ignorato da git; modello in `firma.properties.esempio`). Senza nessuna
    // delle due il pacchetto esce non firmato, con un avviso.
    def firma = [
        file:        System.getenv('WIRE_FIRMA_FILE') ?: 'firma.jks',
        password:    System.getenv('WIRE_FIRMA_PASSWORD'),
        alias:       System.getenv('WIRE_FIRMA_ALIAS'),
        keyPassword: System.getenv('WIRE_FIRMA_KEY_PASSWORD'),
    ]
    def firmaProps = rootProject.file('firma.properties')
    if (!firma.password && firmaProps.exists()) {
        def p = new Properties()
        firmaProps.withInputStream { p.load(it) }
        firma.file        = p.getProperty('file', firma.file)
        firma.password    = p.getProperty('password')
        firma.alias       = p.getProperty('alias')
        firma.keyPassword = p.getProperty('keyPassword', p.getProperty('password'))
    }
    def firmaPronta = firma.password && firma.alias && file(firma.file).exists()
    if (!firmaPronta) {
        logger.warn("THE WIRE: nessuna chiave di firma (WIRE_FIRMA_* o android/firma.properties): il pacchetto release esce NON firmato.")
    }

    signingConfigs {
        release {
            if (firmaPronta) {
                storeFile file(firma.file)
                storePassword firma.password
                keyAlias firma.alias
                keyPassword firma.keyPassword ?: firma.password
            }
        }
    }
    namespace = "com.mazzo.thewire"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mazzo.thewire"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            signingConfig firmaPronta ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
